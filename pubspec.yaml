name: flipideas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  share_plus: ^13.1.0
  go_router: ^17.2.1
  image: ^4.8.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2
  vibration: ^3.1.8
  speech_to_text: ^7.3.0
  flutter_markdown: ^0.7.7+1
  device_info_plus: ^13.1.0   # o la última versión

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_icono.png"
  web:
    generate: true
    image_path: "assets/images/logo_icono.png"
    backgroundColor: "#1A237E"
    themeColor: "#1A237E"
  windows:
    generate: true
    image_path: "assets/images/logo_icono.png"
    icon_size: 48

flutter_native_splash:
  color: "#1A237E"
  image: "assets/images/logo_inicio.png"
  
  # Configuraciones de escala para evitar recortes
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: center
  
  # En Android 12, si la imagen es muy ancha, se corta porque el sistema la mete en un círculo.
  # Al quitar la sección específica de android_12, el paquete intentará generarlo de forma más compatible.
  # fullscreen: true (Eliminado para evitar que se estire)

flutter:
  uses-material-design: true
  assets:
    - assets/images/nuevo_logo.png
    - assets/images/logo_inicio.png
    - assets/images/logo_icono.png
